# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Sendspin 4+ changes the client identity/pairing protocol. Keep the
    # physically reviewed Music Assistant 2.9 browser bridge on 3.x until that
    # protocol migration has its own compatibility and device validation.
    ignore:
      - dependency-name: "@sendspin/sendspin-js"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/maintenance-agent"
    schedule:
      interval: "weekly"
    groups:
      maintenance-agent-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/agents/android-tv"
    schedule:
      interval: "weekly"
    groups:
      android-agent-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/src/esphome"
    schedule:
      interval: "weekly"
    groups:
      esphome-native-client:
        patterns: ["*"]
