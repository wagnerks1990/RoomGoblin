# Stable identity consumed by both image publication gates; includes operator tests.
name: Display browser regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CI_EVENT_NAME: ${{ github.event_name }}
  CI_BASE_REF: ${{ github.event.pull_request.base.ref }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  display-browser:
    # Playwright 1.57 does not support the Ubuntu 26.04 latest runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select conservative PR validation scope
        id: scope
        run: python tools/ci-scope.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.full != 'false'
        with:
          node-version: '22'
      - name: Install locked browser dependencies
        if: steps.scope.outputs.full != 'false'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare browser tests and same-origin fonts
        if: steps.scope.outputs.full != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          bash tools/prepare-display-fonts.sh
          python3 -m venv /tmp/display-tests
          /tmp/display-tests/bin/pip install -r test/browser/requirements.txt
          /tmp/display-tests/bin/python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test receivers, PDF documents and responsive operator workspaces
        if: steps.scope.outputs.full != 'false'
        env:
          DISPLAY_TEST_BROWSER: ${{ matrix.browser }}
        run: /tmp/display-tests/bin/python -m unittest discover -s test/browser -v
      - name: Retain rendered evidence
        if: always() && steps.scope.outputs.full != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: display-browser-${{ matrix.browser }}
          path: |
            test-results/display/
            test-results/workspaces/
            test-results/documents/
          retention-days: 14

  chess-browser:
    # Keep inside this stable publication-gated workflow; no production dependency.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select conservative PR validation scope
        id: scope
        run: python tools/ci-scope.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.full != 'false'
        with:
          node-version: '22'
      - name: Install locked application and isolated chess browser dependencies
        if: steps.scope.outputs.full != 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix test/browser/node --ignore-scripts --no-audit --no-fund
          node test/browser/node/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test chess gameplay, SCORM, teaching, privacy and 3D presentation
        if: steps.scope.outputs.full != 'false'
        env:
          CHESS_TEST_BROWSER: chromium
          NODE_PATH: ${{ github.workspace }}/test/browser/node/node_modules
        run: |
          set -euo pipefail
          for test in \
            learning-chess-training-smoke \
            learning-chess-review-smoke \
            learning-chess-studies-smoke \
            learning-chess-challenges-scorm-smoke \
            learning-chess-challenges-smoke \
            learning-chess-puzzle-package-smoke \
            chess-puzzle-runs-ui-smoke \
            chess-events-ui-smoke \
            chess-cinematic-art-smoke \
            learning-chess-vision-smoke \
            learning-chess-coach-smoke \
            learning-chess-computer-cinema-smoke \
            learning-chess-premove-smoke \
            chess-cinematic-camera-smoke \
            chess-cinematic-next-smoke \
            learning-chess-interaction-smoke \
            learning-chess-smoke \
            learning-chess-ux-smoke; do
            echo "Running ${test}"
            node "test/browser/${test}.cjs"
          done
