name: ESPHome development workspace
on:
  push:
    branches: [integration/esphome-devices]
    paths: [.github/workflows/esphome-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Prepare public source and locked test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          tar --exclude=.git -czf /tmp/esphome-workspace.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esphome-workspace
          path: /tmp/esphome-workspace.tar.gz
          retention-days: 1
