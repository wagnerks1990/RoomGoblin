name: ESPHome development workspace
on:
  push:
    branches: [integration/esphome-devices]
    paths: [.github/workflows/esphome-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Inspect pinned client and compatible dependencies
        run: |
          python3 -m venv /tmp/esp-venv
          /tmp/esp-venv/bin/pip install aioesphomeapi==46.4.1
          mkdir -p /tmp/esp-deps
          /tmp/esp-venv/bin/pip freeze > /tmp/esp-deps/requirements.txt
          /tmp/esp-venv/bin/pip download -r /tmp/esp-deps/requirements.txt --python-version 3.13 --only-binary=:all: -d /tmp/esp-deps/wheels
          cp -r /tmp/esp-venv/lib/python*/site-packages/aioesphomeapi /tmp/esp-deps/
          tar -C /tmp/esp-deps -czf /tmp/esphome-client.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esphome-client
          path: /tmp/esphome-client.tar.gz
          retention-days: 1
