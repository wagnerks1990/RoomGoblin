name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify canonical source tree
        run: |
          test -f src/server.js
          test -f src/storage.js
          test -f src/startup-recovery.js
          test -f maintenance-agent/server.js
          test -f maintenance-agent/extensions.js
          test -f host-agent/start.py
          test -f host-agent/full_recovery.py
          test -f public/controller/index.html
          test -f public/display/index.html
          test -f AGENTS.md
          test -f docs/AI-CONTEXT.md
          test ! -e Caddyfile
          test ! -e source-archive
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate application and browser syntax
        run: npm run check
      - name: Install locked maintenance dependencies
        working-directory: maintenance-agent
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit maintenance production dependencies
        working-directory: maintenance-agent
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate maintenance syntax
        run: |
          node --check maintenance-agent/server.js
          node --check maintenance-agent/extensions.js
          node --check maintenance-agent/android-tv-agent-artifact.js
      - name: Run stabilization regression tests
        run: npm test
      - name: Validate host agent Python
        run: |
          python -m py_compile host-agent/server.py host-agent/start.py host-agent/full_recovery.py
          python -m unittest host-agent/test_full_recovery.py
      - name: Validate installer shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
      - name: Validate Compose configuration
        run: docker compose config --format json | python3 tools/validate-host-network.py
      - name: Build from a private local source context
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d "$RUNNER_TEMP/hub-private-context-XXXXXX")"
          trap 'rm -rf "$context"' EXIT
          git archive HEAD | tar -x -C "$context"
          find "$context/src" "$context/public" "$context/config" "$context/tools" -type d -exec chmod 0700 {} +
          find "$context/src" "$context/public" "$context/config" "$context/tools" -type f -exec chmod 0600 {} +
          chmod 0600 "$context/VERSION" "$context/package.json" "$context/package-lock.json"
          test "$(stat -c %a "$context/src/server.js")" = 600
          test "$(stat -c %a "$context/src")" = 700
          docker build --network host -t classroom-control-hub:test "$context"
      - name: Verify packaged access without root or runtime mounts
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' classroom-control-hub:test)" = 10001:10001
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node classroom-control-hub:test tools/verify-image-permissions.js
      - name: Build maintenance container
        run: docker build -f maintenance-agent/Dockerfile -t classroom-control-hub-maintenance:test .
      - name: Scan main image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: classroom-control-hub:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan maintenance image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: classroom-control-hub-maintenance:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Host-network container smoke test
        run: bash tools/smoke-host-network.sh
      - name: Verify image release stamping
        run: |
          expected="$(cat VERSION)"
          docker run --rm --entrypoint node classroom-control-hub:test -e "const fs=require('fs');const v=fs.readFileSync('/app/VERSION','utf8').trim();if(v!=='$expected')process.exit(1);for(const f of ['/app/public/controller/app.js','/app/public/display/index.html','/app/public/lab-agent/ClassroomHubAgent.ps1'])if(!fs.readFileSync(f,'utf8').includes(v))process.exit(2)"
          docker run --rm --entrypoint node classroom-control-hub-maintenance:test -e "const fs=require('fs');const s=fs.readFileSync('/app/server.js','utf8');if(!s.includes('$expected'))process.exit(1);if(!fs.existsSync('/app/android-agent/agent-release-unsigned.apk')||!fs.existsSync('/app/android-agent/agent-build.json'))process.exit(2)"
      - name: Compose direct HTTP smoke test
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^MAINTENANCE_TOKEN=.*/MAINTENANCE_TOKEN=ci-network-maintenance/' .env
          sed -i 's/^SETUP_TOKEN=.*/SETUP_TOKEN=ci-setup-token/' .env
          mkdir -p data/backups
          sudo chown -R 10001:10001 data
          sudo chown root:10001 data data/backups
          sudo chmod 0770 data
          sudo chmod 0700 data/backups
          sudo install -d -m 0750 -o root -g 10001 /etc/classroom-control-hub/veyon
          sudo install -d -m 0700 -o root -g root /opt/classroom-hub-backups/recovery-staging
          sudo install -d -m 0700 -o root -g root /etc/classroom-control-hub/android-agent-signing
          sudo install -d -m 0755 /run/classroom-control-hub
          sudo chown "$(id -u):$(id -g)" /run/classroom-control-hub
          openssl rand -hex 32 | sudo tee /etc/classroom-control-hub/master.key >/dev/null
          sudo chown root:10001 /etc/classroom-control-hub/master.key
          sudo chmod 0640 /etc/classroom-control-hub/master.key
          sudo install -m 0640 -o root -g 10001 /dev/null /etc/classroom-control-hub/veyon/private.pem
          python3 tools/fixtures/host-agent-network.py /run/classroom-control-hub/host-agent.sock "$(cat VERSION)" &
          host_agent_fixture=$!
          for i in $(seq 1 30); do [[ -S /run/classroom-control-hub/host-agent.sock ]] && break; sleep 1; done
          [[ -S /run/classroom-control-hub/host-agent.sock ]]
          trap 'kill "$host_agent_fixture" 2>/dev/null || true; docker compose logs --no-color || true; docker compose down -v || true; sudo rm -f /run/classroom-control-hub/host-agent.sock' EXIT
          docker tag classroom-control-hub:test ghcr.io/wagnerks1990/roomgoblin:ci
          docker tag classroom-control-hub-maintenance:test ghcr.io/wagnerks1990/roomgoblin-maintenance:ci
          export CLASSROOM_CONTROL_HUB_TAG=ci
          docker compose up -d --no-build maintenance-agent classroom-hub
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/health | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1)})'
          cookie_jar="$RUNNER_TEMP/classroom-hub.cookies"
          curl -fsS -c "$cookie_jar" -H 'X-Setup-Token: ci-setup-token' -H 'Content-Type: application/json' --data '{"username":"ci-admin","displayName":"CI Administrator","password":"CI-Symbol!Password#Alpha71"}' http://127.0.0.1:3000/api/v1/setup/administrator >/dev/null
          curl -fsS -b "$cookie_jar" -H 'Content-Type: application/json' -X PUT --data '{"completed":true}' http://127.0.0.1:3000/api/v1/admin/setup-state >/dev/null
          docker compose restart classroom-hub
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health >/dev/null && break; sleep 1; done
          curl -fsS -b "$cookie_jar" http://127.0.0.1:3000/api/v1/admin/health | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);if(!j.ok||j.database.normalized.users!==1)process.exit(1)})'

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse Windows lab-agent scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem public/lab-agent/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { throw 'Windows lab-agent PowerShell parsing failed.' }
      - name: Verify Windows agent contract
        shell: pwsh
        run: |
          $agent = Get-Content public/lab-agent/ClassroomHubAgent.ps1 -Raw
          $dockerfile = Get-Content Dockerfile -Raw
          if ($dockerfile -notmatch 'public/lab-agent/ClassroomHubAgent\.ps1') { throw 'Windows agent is not included in release-version stamping.' }
          foreach ($action in @('screenshot','refresh-history','instructor-lock','update-agent')) {
            if ($agent -notmatch "'$([regex]::Escape($action))'\s*\{") { throw "Missing Windows action: $action" }
          }

  android-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Java and Android SDK
        run: |
          java -version
          test -n "${ANDROID_HOME:-}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  '"$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: agents/android-tv
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s agents/android-tv/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClassroomHub-Display-Agent-debug
          path: agents/android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
