name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'docs/WIKI-SYNC.md'
      - 'scripts/sync-wiki.sh'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip stale mirror snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" || {
            echo 'A newer main commit exists; synchronize its mirror instead.'
            git fetch origin main
            git checkout --detach FETCH_HEAD
          }
      - name: Configure Git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Clone Wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 0700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki

      - name: Synchronize Wiki mirror
        run: |
          set -euo pipefail
          find /tmp/wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a wiki/. /tmp/wiki/
          cd /tmp/wiki
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already synchronized.'
            exit 0
          fi
          git commit -m "Sync Wiki from ${GITHUB_SHA}"

      - name: Push Wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cd /tmp/wiki
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 0700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -c credential.helper= push origin HEAD:master
