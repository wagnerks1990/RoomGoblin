name: Fix media status rate limit

on:
  push:
    branches:
      - feature/automation-media-sessions-rebased

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[media-rate-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/automation-media-sessions-rebased
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply media status rate limit
        run: python3 tools/fix-media-status-rate-limit.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and focused regression
        run: |
          npm run check
          node --test --test-concurrency=1 test/automation-media-sessions.test.js test/automation-runtime.test.js test/automation-convergence.test.js test/automation-framework-manual.test.js test/display-browser.test.js test/backend-production-regressions.test.js
      - name: Run full Node regression suite
        run: npm test
      - name: Commit validated fix
        run: |
          git config user.name "RoomGoblin Security Fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js
          git commit -m "Rate-limit media playback status reads [media-rate-fix]"
          git push origin HEAD:feature/automation-media-sessions-rebased
