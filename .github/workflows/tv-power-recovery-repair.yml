name: Repair TV power recovery on work branch

on:
  push:
    branches: [fix/tv-power-aggregate-sequence]
    paths:
      - '.github/workflows/tv-power-recovery-repair.yml'
      - 'tools/apply-tv-power-recovery-fix.py'
      - 'test/automation-tv-power-recovery.test.js'

permissions:
  contents: write

concurrency:
  group: tv-power-recovery-work-branch
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/tv-power-aggregate-sequence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify isolated source and repair syntax
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/tv-power-aggregate-sequence
          test "$(git hash-object src/server.js)" = 25e3c2c8ed9e55976f517a5f94cf5d688385d84c
          node --check test/automation-tv-power-recovery.test.js
          python3 -m py_compile tools/apply-tv-power-recovery-fix.py
      - name: Prove the recovery regression before applying the fix
        run: |
          set -euo pipefail
          set +e
          node --test --test-name-pattern='^recovered All TVs off preserves its broadcast when it owns every TV winner$' test/automation-tv-power-recovery.test.js > "$RUNNER_TEMP/tv-power-recovery-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/tv-power-recovery-red.log"
          test "$status" -eq 1
          grep -Fq 'ERR_ASSERTION' "$RUNNER_TEMP/tv-power-recovery-red.log"
          grep -Fq 'cecOutput' "$RUNNER_TEMP/tv-power-recovery-red.log"
          grep -Fq 'cecAllOutputs' "$RUNNER_TEMP/tv-power-recovery-red.log"
          if grep -Eq 'ReferenceError|SyntaxError|Cannot find module' "$RUNNER_TEMP/tv-power-recovery-red.log"; then exit 1; fi
      - name: Apply source and documentation correction
        run: python3 tools/apply-tv-power-recovery-fix.py
      - name: Verify sequence and recovery regressions together
        run: node --test test/automation-tv-power-*.test.js
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix maintenance-agent
      - name: Check syntax and run the complete Node suite
        run: |
          npm run check
          npm test
      - name: Remove temporary tooling and commit the tested correction
        run: |
          set -euo pipefail
          rm .github/workflows/tv-power-recovery-repair.yml tools/apply-tv-power-recovery-fix.py
          git diff --check
          git config user.name "RoomGoblin Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js AGENTS.md docs/AI-CONTEXT.md docs/CONTROLLER.md docs/TV-POWER-AUTOMATION.md wiki/Automation-Display-Media.md CHANGELOG.md .github/workflows/tv-power-recovery-repair.yml tools/apply-tv-power-recovery-fix.py
          git diff --cached --stat
          git commit -m "Preserve aggregate intent through TV-power startup and resume reconciliation"
          git push origin HEAD:fix/tv-power-aggregate-sequence
