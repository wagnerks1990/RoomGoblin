name: Apply ESPHome keyless adoption fix
on:
  push:
    branches: [fix/esphome-keyless-adoption]
    paths: [.github/workflows/esphome-keyless-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/esphome-keyless-adoption
          fetch-depth: 0
      - name: Install pinned ESPHome client requirements
        run: python3 -m pip install -r src/esphome/requirements.txt
      - name: Patch worker and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/esphome/worker.py')
          s=p.read_text()
          old='''    key = config.get("key", "")\n    if len(key) != 44 or len(base64.b64decode(key, validate=True)) != 32:\n        raise ValueError("encryption-key-required")\n'''
          new='''    key = config.get("key", "")\n    if key != "":\n        if len(key) != 44 or len(base64.b64decode(key, validate=True)) != 32:\n            raise ValueError("invalid-encryption-key")\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old='''        return self.client_factory(config["address"], config["port"], noise_psk=config["key"],\n'''
          new='''        return self.client_factory(config["address"], config["port"], noise_psk=config["key"] or None,\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))

          t=Path('test/esphome_worker_test.py')
          s=t.read_text()
          s=s.replace('''    def test_private_target_and_encryption_required(self):\n''','''    def test_private_target_and_optional_encryption(self):\n''')
          old='''        for key in ("", KEY+"\\n", "malformed"):\n            with self.assertRaises(ValueError):\n                valid_target({**config(), "key": key})\n'''
          new='''        self.assertEqual(valid_target({**config(), "key": ""})["key"], "")\n        for key in (KEY+"\\n", "malformed"):\n            with self.assertRaises(ValueError):\n                valid_target({**config(), "key": key})\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          marker='''    async def test_enrollment_probe_is_read_only_and_closes_connection(self):\n'''
          insert='''    async def test_unencrypted_probe_uses_no_noise_psk(self):\n        open_config={**config(), "key": ""}\n        result=await self.worker.probe(open_config)\n        self.assertEqual(result["info"]["mac_address"], MAC)\n        self.assertIsNone(FakeClient.seen[-1].kwargs["noise_psk"])\n        self.assertTrue(FakeClient.seen[-1].closed)\n\n'''
          assert marker in s
          s=s.replace(marker,insert+marker)
          t.write_text(s)
          PY
          python3 -m py_compile src/esphome/worker.py
          PYTHONPATH=. python3 test/esphome_worker_test.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/esphome/worker.py test/esphome_worker_test.py
          git commit -m 'fix: allow ESPHome devices without native API encryption'
          git push origin HEAD:fix/esphome-keyless-adoption
