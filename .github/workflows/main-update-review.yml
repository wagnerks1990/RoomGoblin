name: Main update source review

on:
  push:
    branches: [fix/main-update-flow]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/roomgoblin-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roomgoblin-main-update-source
          path: ${{ runner.temp }}/roomgoblin-source.tar.gz
          if-no-files-found: error
          retention-days: 1
