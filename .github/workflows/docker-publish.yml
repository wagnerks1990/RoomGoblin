name: Publish Containers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  actions: read
  checks: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify release ref matches application version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
          node -e 'const p=require("./package.json"),m=require("./maintenance-agent/package.json"),v=require("fs").readFileSync("VERSION","utf8").trim();if(p.version!==v||m.version!==v)process.exit(1)'
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
          for required in 'Validate' 'Display browser regression' 'Security gates'; do
            jq -e --arg name "$required" '[.workflow_runs[] | select(.name==$name and .head_branch=="main")] | sort_by(.id, .run_attempt) | last | .conclusion=="success"' <<<"$runs" >/dev/null \
              || { echo "Required main-branch workflow did not pass for tag commit: $required" >&2; exit 1; }
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both published source images before release promotion
        run: |
          set -euo pipefail
          source deploy/image-readiness.sh
          roomgoblin_wait_image_pair "$GITHUB_SHA" "ghcr.io/wagnerks1990/roomgoblin:sha-$GITHUB_SHA" "ghcr.io/wagnerks1990/roomgoblin-maintenance:sha-$GITHUB_SHA"
      - name: Promote the validated pair to release aliases
        run: |
          set -euo pipefail
          for image in roomgoblin roomgoblin-maintenance; do
            case "$image" in
              roomgoblin) legacy=classroom-control-hub ;;
              roomgoblin-maintenance) legacy=classroom-control-hub-maintenance ;;
            esac
            docker buildx imagetools create \
              --tag "ghcr.io/wagnerks1990/${image}:${GITHUB_REF_NAME}" \
              --tag "ghcr.io/wagnerks1990/${legacy}:${GITHUB_REF_NAME}" \
              "ghcr.io/wagnerks1990/${image}:sha-${GITHUB_SHA}"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify tag matches application version
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
