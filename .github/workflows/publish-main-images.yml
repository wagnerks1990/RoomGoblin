name: Publish Main Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read
  packages: write

concurrency:
  group: publish-main-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for every required validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=('Validate' 'Display browser regression' 'Security gates')
          for attempt in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VALIDATED_SHA}&event=push&per_page=100")"
            missing=()
            for name in "${required[@]}"; do
              state="$(jq -r --arg name "$name" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | if . == null then "missing" elif .conclusion != null then .conclusion else .status end' <<<"$runs")"
              case "$state" in
                success) ;;
                failure|cancelled|timed_out|action_required|stale|skipped)
                  echo "Required validation workflow failed: ${name}=${state}" >&2
                  exit 1
                  ;;
                *) missing+=("$name");;
              esac
            done
            if (( ${#missing[@]} == 0 )); then
              echo "All required validation workflows passed for ${VALIDATED_SHA}."
              break
            fi
            if (( attempt == 60 )); then
              printf 'Required workflows did not all pass: %s\n' "${missing[*]}" >&2
              exit 1
            fi
            printf 'Waiting for required workflows: %s\n' "${missing[*]}"
            sleep 30
          done

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            image: ghcr.io/wagnerks1990/roomgoblin
            legacy_image: ghcr.io/wagnerks1990/classroom-control-hub
            dockerfile: Dockerfile
          - name: maintenance
            image: ghcr.io/wagnerks1990/roomgoblin-maintenance
            legacy_image: ghcr.io/wagnerks1990/classroom-control-hub-maintenance
            dockerfile: maintenance-agent/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact publication candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.legacy_image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan exact publication candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Smoke exact publication candidate
        run: |
          set -euo pipefail
          image='${{ matrix.image }}:sha-${{ github.sha }}'
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = '${{ github.sha }}'
          case '${{ matrix.name }}' in
            hub)
              docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$image" tools/verify-image-permissions.js
              ;;
            maintenance)
              docker run --rm --entrypoint node "$image" -e 'const fs=require("fs"),crypto=require("crypto");const m=JSON.parse(fs.readFileSync("/app/android-agent/agent-build.json"));const p="/app/android-agent/agent-release-unsigned.apk";if(m.package!=="org.roomgoblin.display"||!m.versionName||!Number.isInteger(m.versionCode)||crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==m.unsignedSha256)process.exit(1)'
              ;;
          esac
      - name: Publish the scanned candidate without rebuilding
        run: |
          set -euo pipefail
          docker push '${{ matrix.image }}:sha-${{ github.sha }}'
          docker push '${{ matrix.legacy_image }}:sha-${{ github.sha }}'

  promote:
    permissions:
      contents: read
      packages: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: publish-main-alpha-promotion
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the validated image pair
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main_sha" != "$VALIDATED_SHA" ]]; then
            echo "Skipping stale alpha promotion for ${VALIDATED_SHA}; main is ${current_main_sha}."
            exit 0
          fi
          for image in roomgoblin roomgoblin-maintenance classroom-control-hub classroom-control-hub-maintenance; do
            docker buildx imagetools create \
              --tag "ghcr.io/wagnerks1990/${image}:alpha" \
              "ghcr.io/wagnerks1990/${image}:sha-${VALIDATED_SHA}"
          done

          # main remains the only source branch; no deployment branch is advanced.
          echo "Published main image pair: ${VALIDATED_SHA}"
