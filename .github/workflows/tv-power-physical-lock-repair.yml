name: Repair TV power physical locks on work branch

on:
  push:
    branches: [fix/tv-power-aggregate-sequence]
    paths:
      - '.github/workflows/tv-power-physical-lock-repair.yml'
      - 'tools/apply-tv-power-physical-lock-fix.py'

permissions:
  contents: write

concurrency:
  group: tv-power-physical-lock-work-branch
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/tv-power-aggregate-sequence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify isolated source and stage physical-output tests
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/tv-power-aggregate-sequence
          test "$(git hash-object src/server.js)" = 31daa2cd4e96bc61b5a5622eed7d2104d396134b
          python3 -m py_compile tools/apply-tv-power-physical-lock-fix.py
          python3 tools/apply-tv-power-physical-lock-fix.py tests
          node --check test/automation-tv-power-sequence.test.js
          node --check test/automation-tv-power-recovery.test.js
      - name: Prove named-receiver output was not protected
        run: |
          set -euo pipefail
          set +e
          node --test --test-name-pattern='^a named announcement receiver protects its physical output during a sequence$' test/automation-tv-power-sequence.test.js > "$RUNNER_TEMP/tv-power-physical-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/tv-power-physical-red.log"
          test "$status" -eq 1
          grep -Fq 'ERR_ASSERTION' "$RUNNER_TEMP/tv-power-physical-red.log"
          grep -Fq 'output: 3' "$RUNNER_TEMP/tv-power-physical-red.log"
          if grep -Eq 'ReferenceError|SyntaxError|Cannot find module' "$RUNNER_TEMP/tv-power-physical-red.log"; then exit 1; fi
      - name: Apply source and documentation correction
        run: python3 tools/apply-tv-power-physical-lock-fix.py source
      - name: Verify sequence and recovery regressions
        run: node --test test/automation-tv-power-*.test.js
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix maintenance-agent
      - name: Check syntax and run the complete Node suite
        run: |
          npm run check
          npm test
      - name: Remove temporary tooling and commit the tested correction
        run: |
          set -euo pipefail
          rm .github/workflows/tv-power-physical-lock-repair.yml tools/apply-tv-power-physical-lock-fix.py
          git diff --check
          git config user.name "RoomGoblin Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js test/automation-tv-power-sequence.test.js test/automation-tv-power-recovery.test.js AGENTS.md docs/AI-CONTEXT.md docs/CONTROLLER.md docs/TV-POWER-AUTOMATION.md wiki/Automation-Display-Media.md CHANGELOG.md .github/workflows/tv-power-physical-lock-repair.yml tools/apply-tv-power-physical-lock-fix.py
          git diff --cached --stat
          git commit -m "Guard announcement-owned physical outputs at the shared TV-power dispatch boundary"
          git push origin HEAD:fix/tv-power-aggregate-sequence
