name: Apply automation reliability follow-up

on:
  push:
    branches:
      - fix/automation-scheduler-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[automation-followup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/automation-scheduler-reliability
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Apply follow-up hardening
        run: |
          python3 tools/prepare-followup-helper.py
          python3 tools/apply-automation-followup.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and controller
        run: npm run check
      - name: Run focused automation tests
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 test/automation-runtime.test.js test/school-schedule.test.js test/automation-framework-manual.test.js test/backend-production-regressions.test.js test/automation-followup.test.js > /tmp/automation-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(# Subtest:|not ok |# tests |# pass |# fail |# duration_ms)|automation-framework-manual\.test\.js:|automation-followup\.test\.js:' /tmp/automation-tests.log | tail -n 160 || true
          else
            tail -n 80 /tmp/automation-tests.log
          fi
          exit "$status"
      - name: Commit follow-up source
        run: |
          if git diff --quiet; then
            echo "No follow-up changes required."
            exit 0
          fi
          git config user.name "RoomGoblin Automation Follow-up"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js public/controller/index.html public/controller/app.js test/automation-followup.test.js test/automation-framework-manual.test.js
          git commit -m "Complete automation planning and recovery hardening [automation-followup]"
          git push origin HEAD:fix/automation-scheduler-reliability
