name: Apply automation reliability migration

on:
  push:
    branches:
      - fix/automation-scheduler-reliability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[automation-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/automation-scheduler-reliability
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Apply source migration
        run: |
          python3 tools/apply-automation-reliability.py
          python3 tools/apply-automation-reliability-tests.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and controller
        run: npm run check
      - name: Run focused automation tests
        run: node --test --test-concurrency=1 test/automation-runtime.test.js test/school-schedule.test.js test/automation-framework-manual.test.js test/backend-production-regressions.test.js
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "RoomGoblin Automation Migration"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js src/school-schedule.js src/automation-runtime.js public/controller/index.html public/controller/app.js public/display/index.html package.json test/backend-production-regressions.test.js test/school-schedule.test.js
          git commit -m "Harden scheduler and isolate automation resources [automation-migration]"
          git push origin HEAD:fix/automation-scheduler-reliability
