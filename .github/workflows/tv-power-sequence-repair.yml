name: Repair TV power sequence on work branch

on:
  push:
    branches: [fix/tv-power-aggregate-sequence]
    paths:
      - '.github/workflows/tv-power-sequence-repair.yml'
      - 'tools/apply-tv-power-sequence-fix.py'
      - 'test/automation-tv-power-sequence.test.js'

permissions:
  contents: write

concurrency:
  group: tv-power-sequence-work-branch
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/tv-power-aggregate-sequence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify isolated branch and unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/tv-power-aggregate-sequence
          test "$(git hash-object src/server.js)" = 03651f450220a808b8f510d08530daccd0ecf85a
          git merge-base --is-ancestor 070481507d183261f36a352805338e375ebbcb7a HEAD
          node --check test/automation-tv-power-sequence.test.js
          python3 -m py_compile tools/apply-tv-power-sequence-fix.py
      - name: Prove the broadcast regression on the unchanged source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test --test-name-pattern='^scheduled All TVs off preserves the manual broadcast command$' test/automation-tv-power-sequence.test.js > "$RUNNER_TEMP/tv-power-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/tv-power-red.log"
          test "$status" -eq 1
          grep -Fq 'ERR_ASSERTION' "$RUNNER_TEMP/tv-power-red.log"
          grep -Fq 'cecOutput' "$RUNNER_TEMP/tv-power-red.log"
          grep -Fq 'cecAllOutputs' "$RUNNER_TEMP/tv-power-red.log"
          if grep -Eq 'ReferenceError|SyntaxError|Cannot find module' "$RUNNER_TEMP/tv-power-red.log"; then exit 1; fi
      - name: Apply the source and documentation correction
        run: python3 tools/apply-tv-power-sequence-fix.py
      - name: Run executable TV-power sequence regressions
        run: node --test test/automation-tv-power-sequence.test.js
      - name: Install locked application and maintenance dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix maintenance-agent
      - name: Validate syntax and controller contracts
        run: npm run check
      - name: Run full Node regression suite
        run: npm test
      - name: Remove work-branch tooling and commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tv-power-sequence-repair.yml tools/apply-tv-power-sequence-fix.py
          git diff --check
          git config user.name "RoomGoblin Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js AGENTS.md docs/AI-CONTEXT.md docs/CONTROLLER.md docs/TV-POWER-AUTOMATION.md wiki/Automation-Display-Media.md CHANGELOG.md .github/workflows/tv-power-sequence-repair.yml tools/apply-tv-power-sequence-fix.py
          git diff --cached --stat
          git commit -m "Preserve aggregate TV power intent through automation sequences"
          git push origin HEAD:fix/tv-power-aggregate-sequence
